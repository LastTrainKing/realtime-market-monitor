[package]
name = "capital_backend"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.0.0", default-features = false, features = ["ipc"] }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
duckdb = { version = "1.10506.0", default-features = false, features = ["bundled"] }
encoding_rs = "0.8.42"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "flate2", "flate2-rust_backend", "base64"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }

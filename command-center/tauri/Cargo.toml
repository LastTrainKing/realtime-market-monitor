[package]
name = "capital_flow_center"
version = "1.1.0"
edition = "2024"

[lib]
name = "capital_flow_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.4.0"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
